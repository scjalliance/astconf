[transport-tcp]
type = transport
protocol = tcp
bind = 100.64.0.1:5060

[000fd3000009]
type = endpoint
context = from-internal
auth = 000fd3000009-auth
aors = 000fd3000009-aor

[fred.soft]
type = endpoint
context = from-internal
auth = fred.soft-auth
aors = fred.soft-aor
callerid = "Fred Flintstone" <100>
set_var = USERNAME=fred
set_var = USER_LOCATION=Quarry
set_var = OUTBOUND_CALLERID=5555550100
set_var = AREACODE=555

[wilma.soft]
type = endpoint
context = from-internal
auth = wilma.soft-auth
aors = wilma.soft-aor
callerid = "Wilma Flintstone" <102>
set_var = USERNAME=wilma
set_var = USER_LOCATION=Remote
set_var = OUTBOUND_CALLERID=5555550300
set_var = AREACODE=555

[yard.soft]
type = endpoint
context = from-internal
auth = yard.soft-auth
aors = yard.soft-aor
callerid = "Yard" <201>
set_var = USER_LOCATION=Remote
set_var = OUTBOUND_CALLERID=5555550300
set_var = AREACODE=555

[000fd3000009-aor]
type = aor
max_contacts = 5
remove_existing = yes

[fred.soft-aor]
type = aor
max_contacts = 5
remove_existing = yes

[wilma.soft-aor]
type = aor
max_contacts = 5
remove_existing = yes

[yard.soft-aor]
type = aor
max_contacts = 5
remove_existing = yes

[trunk-den]
type = endpoint
transport = transport-tcp
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
allow = g722
auth = auth-trunk-den
outbound_auth = auth-trunk-den
aors = trunk-den
direct_media = no

[trunk-qry]
type = endpoint
transport = transport-tcp
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
allow = g722
auth = auth-trunk-qry
outbound_auth = auth-trunk-qry
aors = trunk-qry
direct_media = no

[trunk-den]
type = aor
contact = sip:den-phone:5060\;transport=tcp

[trunk-qry]
type = aor
contact = sip:qry-phone:5060\;transport=tcp

[trunk-den]
type = identify
endpoint = trunk-den
match = den-phone

[trunk-qry]
type = identify
endpoint = trunk-qry
match = qry-phone

[publish-den]
type = outbound-publish
server_uri = sip:trunk-hub@den-phone:5060\;transport=tcp
event = asterisk-devicestate
outbound_auth = auth-trunk-den
@device_state_filter = ^PJSIP/(fred\.soft|wilma\.soft|yard\.soft)$

[publish-mwi-den]
type = outbound-publish
server_uri = sip:trunk-hub@den-phone:5060\;transport=tcp
event = asterisk-mwi
outbound_auth = auth-trunk-den

[publish-qry]
type = outbound-publish
server_uri = sip:trunk-hub@qry-phone:5060\;transport=tcp
event = asterisk-devicestate
outbound_auth = auth-trunk-qry
@device_state_filter = ^PJSIP/(fred\.soft|wilma\.soft|yard\.soft)$

[publish-mwi-qry]
type = outbound-publish
server_uri = sip:trunk-hub@qry-phone:5060\;transport=tcp
event = asterisk-mwi
outbound_auth = auth-trunk-qry

[trunk-den]
type = inbound-publication
endpoint = trunk-den
event_asterisk-devicestate = den

[trunk-qry]
type = inbound-publication
endpoint = trunk-qry
event_asterisk-devicestate = qry

[den]
type = asterisk-publication
devicestate_publish = publish-den
mailboxstate_publish = publish-mwi-den
device_state = yes
device_state_filter = ^PJSIP/(barney|lobby)$

[qry]
type = asterisk-publication
devicestate_publish = publish-qry
mailboxstate_publish = publish-mwi-qry
device_state = yes
device_state_filter = ^PJSIP/(000fd3000003|fred)$
