[transport-tcp]
type = transport
protocol = tcp
bind = 100.64.0.2:5060

[lobby]
type = endpoint
context = from-internal
auth = lobby-auth
aors = lobby-aor
callerid = "Lobby" <200>
mailboxes = 300@default
set_var = USER_LOCATION=Den
set_var = OUTBOUND_CALLERID=5555550200
set_var = AREACODE=555

[barney]
type = endpoint
context = from-internal
auth = barney-auth
aors = barney-aor
callerid = "Barney Rubble" <101>
mailboxes = 101@default
set_var = USERNAME=barney
set_var = USER_LOCATION=Den
set_var = OUTBOUND_CALLERID=5555550200
set_var = AREACODE=555

[lobby-aor]
type = aor
max_contacts = 5
remove_existing = yes

[barney-aor]
type = aor
max_contacts = 5
remove_existing = yes

[trunk-hub]
type = endpoint
transport = transport-tcp
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
allow = g722
auth = auth-trunk-hub
outbound_auth = auth-trunk-hub
aors = trunk-hub
direct_media = no

[trunk-qry]
type = endpoint
transport = transport-tcp
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
allow = g722
auth = auth-trunk-qry
outbound_auth = auth-trunk-qry
aors = trunk-qry
direct_media = no

[trunk-hub]
type = aor
contact = sip:hub-phone:5060\;transport=tcp

[trunk-qry]
type = aor
contact = sip:qry-phone:5060\;transport=tcp

[trunk-hub]
type = identify
endpoint = trunk-hub
match = hub-phone

[trunk-qry]
type = identify
endpoint = trunk-qry
match = qry-phone

[publish-hub]
type = outbound-publish
server_uri = sip:trunk-den@hub-phone:5060\;transport=tcp
event = asterisk-devicestate
outbound_auth = auth-trunk-hub
@device_state_filter = ^PJSIP/(barney|lobby)$

[publish-qry]
type = outbound-publish
server_uri = sip:trunk-den@qry-phone:5060\;transport=tcp
event = asterisk-devicestate
outbound_auth = auth-trunk-qry
@device_state_filter = ^PJSIP/(barney|lobby)$

[trunk-hub]
type = inbound-publication
endpoint = trunk-hub
event_asterisk-devicestate = hub
event_asterisk-mwi = hub

[trunk-qry]
type = inbound-publication
endpoint = trunk-qry
event_asterisk-devicestate = qry

[hub]
type = asterisk-publication
devicestate_publish = publish-hub
device_state = yes
device_state_filter = ^PJSIP/(fred\.soft|wilma\.soft|yard\.soft)$
mailbox_state = yes

[qry]
type = asterisk-publication
devicestate_publish = publish-qry
device_state = yes
device_state_filter = ^PJSIP/(000fd3000003|fred)$
